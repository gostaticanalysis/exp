<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>新橋エリア飲食店比較</title>
<style>
  :root {
    --bg: #f6f3ee;
    --surface: #ffffff;
    --surface-2: #ece6db;
    --border: #ddd4c4;
    --ink: #211d18;
    --ink-muted: #6f675a;
    --ink-faint: #948c7c;
    --accent: #33465c;
    --accent-ink: #ffffff;
    --accent-soft: #e4e9ee;
    --green-bg: #e3f1e6; --green-fg: #1f6b3a; --green-bd: #bfe0c8;
    --yellow-bg: #fbf1d6; --yellow-fg: #8a6a05; --yellow-bd: #ecd99a;
    --red-bg: #fbe6e3; --red-fg: #ab3629; --red-bd: #f0bdb5;
    --gray-bg: #ece9e3; --gray-fg: #6f675a; --gray-bd: #d8d2c4;
    --purple-bg: #ece5f5; --purple-fg: #5c3e91; --purple-bd: #d7c7ec;
    --shadow: 0 1px 2px rgba(33,29,24,0.06), 0 4px 14px rgba(33,29,24,0.08);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17140f;
      --surface: #221e18;
      --surface-2: #2b261e;
      --border: #3a3327;
      --ink: #f2ede2;
      --ink-muted: #b8ae9a;
      --ink-faint: #8b8271;
      --accent: #8fa8c4;
      --accent-ink: #14202c;
      --accent-soft: #263543;
      --green-bg: #16301f; --green-fg: #7fd39b; --green-bd: #234a30;
      --yellow-bg: #362c0e; --yellow-fg: #e4c25b; --yellow-bd: #4d3f16;
      --red-bg: #391d18; --red-fg: #e6897c; --red-bd: #532a22;
      --gray-bg: #2b271f; --gray-fg: #b8ae9a; --gray-bd: #3a3327;
      --purple-bg: #2b2138; --purple-fg: #c7a9ec; --purple-bd: #3e2f52;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17140f;
    --surface: #221e18;
    --surface-2: #2b261e;
    --border: #3a3327;
    --ink: #f2ede2;
    --ink-muted: #b8ae9a;
    --ink-faint: #8b8271;
    --accent: #8fa8c4;
    --accent-ink: #14202c;
    --accent-soft: #263543;
    --green-bg: #16301f; --green-fg: #7fd39b; --green-bd: #234a30;
    --yellow-bg: #362c0e; --yellow-fg: #e4c25b; --yellow-bd: #4d3f16;
    --red-bg: #391d18; --red-fg: #e6897c; --red-bd: #532a22;
    --gray-bg: #2b271f; --gray-fg: #b8ae9a; --gray-bd: #3a3327;
    --purple-bg: #2b2138; --purple-fg: #c7a9ec; --purple-bd: #3e2f52;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
  }
  .tnum { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
  button, input, select { font: inherit; color: inherit; }
  a { color: var(--accent); }
  button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  #app-header {
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 8px 12px 10px;
  }
  .title-row {
    display: flex; flex-direction: column; gap: 2px;
    margin-bottom: 8px;
  }
  .title-row h1 {
    font-size: 17px; font-weight: 700; letter-spacing: 0.01em; margin: 0;
  }
  .title-row .subtitle { font-size: 12px; color: var(--ink-faint); }

  #tabs {
    display: flex; gap: 6px; background: var(--surface-2); border-radius: 10px; padding: 3px;
  }
  #tabs button {
    flex: 1; border: none; background: transparent; padding: 9px 4px; border-radius: 8px;
    font-size: 15px; font-weight: 600; color: var(--ink-muted); min-height: 44px;
  }
  #tabs button.active { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }

  #count-bar {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 10px; font-size: 13px; color: var(--ink-muted);
  }
  #count-bar strong { font-size: 20px; color: var(--ink); font-weight: 800; }
  #count-bar .count-unit { font-size: 13px; font-weight: 600; color: var(--ink-muted); margin-left: 2px; }

  .toolbar {
    display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap;
  }
  .toolbar input[type="search"] {
    flex: 1 1 140px; min-width: 0; min-height: 44px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 10px; background: var(--surface); color: var(--ink);
    font-size: 16px;
  }
  .toolbar select {
    min-height: 44px; padding: 0 10px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--ink); font-size: 14px;
  }
  .icon-btn, .text-btn {
    min-height: 44px; min-width: 44px; border: 1px solid var(--border); border-radius: 10px;
    background: var(--surface); color: var(--ink); font-size: 14px; font-weight: 600; padding: 0 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .text-btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); position: relative; }
  .filter-badge {
    display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px;
    padding: 0 5px; border-radius: 999px; background: var(--red-fg); color: #fff; font-size: 11px; font-weight: 800;
    margin-left: 2px;
  }
  .filter-badge.hidden { display: none; }

  #quick-genre { margin-top: 10px; }
  #quick-genre .qg-major {
    display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
  }
  #quick-genre .qg-major::-webkit-scrollbar { display: none; }
  #quick-genre .qg-major button {
    flex: none; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); color: var(--ink-muted); font-size: 13.5px; font-weight: 700; white-space: nowrap;
  }
  #quick-genre .qg-major button.active { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  #quick-genre .qg-minor {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;
  }
  #quick-genre .qg-minor button {
    flex: none; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink-muted); font-size: 12.5px; font-weight: 600;
  }
  #quick-genre .qg-minor button.active { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  #quick-genre .qg-count { color: var(--ink-faint); font-weight: 500; }

  .chips {
    display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 6px; background: var(--accent-soft); color: var(--accent);
    border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: 12.5px; font-weight: 600;
    min-height: 30px;
  }
  .chip button {
    border: none; background: transparent; color: inherit; min-width: 24px; min-height: 24px; border-radius: 50%;
    font-size: 15px; line-height: 1; cursor: pointer;
  }

  main { padding: 10px 12px 90px; }
  #list-view.hidden, #map-view.hidden { display: none; }

  #cards { display: flex; flex-direction: column; gap: 10px; }
  .empty-state { text-align: center; color: var(--ink-faint); padding: 40px 16px; font-size: 14px; }

  .card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px;
    box-shadow: var(--shadow);
  }
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .card-name { font-size: 15.5px; font-weight: 700; line-height: 1.35; }
  .card-rating { flex: none; text-align: right; font-size: 13px; color: var(--ink-muted); white-space: nowrap; }
  .card-rating .star { color: #c9891a; }
  .card-rating b { font-size: 15px; color: var(--ink); }
  .card-meta { margin-top: 4px; font-size: 13px; color: var(--ink-muted); }
  .card-meta .dot { margin: 0 5px; color: var(--ink-faint); }
  .card-hours { margin-top: 6px; font-size: 13px; color: var(--ink); background: var(--surface-2); border-radius: 8px; padding: 5px 9px; display: inline-block; }
  .badges { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
  .badge {
    display: inline-flex; align-items: center; font-size: 12px; font-weight: 700; padding: 3px 9px;
    border-radius: 999px; border: 1px solid transparent;
  }
  .badge-green { background: var(--green-bg); color: var(--green-fg); border-color: var(--green-bd); }
  .badge-yellow { background: var(--yellow-bg); color: var(--yellow-fg); border-color: var(--yellow-bd); }
  .badge-red { background: var(--red-bg); color: var(--red-fg); border-color: var(--red-bd); }
  .badge-gray { background: var(--gray-bg); color: var(--gray-fg); border-color: var(--gray-bd); }
  .badge-purple { background: var(--purple-bg); color: var(--purple-fg); border-color: var(--purple-bd); }

  .card-actions { margin-top: 10px; display: flex; gap: 8px; }
  .card-actions a, .card-actions button {
    flex: 1; min-height: 40px; border-radius: 9px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink); font-size: 13.5px; font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 4px; text-decoration: none;
  }
  .card-actions a[aria-disabled="true"] { opacity: 0.4; pointer-events: none; }
  .card-actions .detail-toggle { background: transparent; }

  .card-detail { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13px; color: var(--ink-muted); display: none; }
  .card-detail.open { display: block; }
  .card-detail dl { display: grid; grid-template-columns: 80px 1fr; gap: 5px 8px; margin: 0; }
  .card-detail dt { color: var(--ink-faint); }
  .card-detail dd { margin: 0; color: var(--ink); }
  .card-detail .hours-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 6px 0; }
  .card-detail .hours-grid div { background: var(--surface-2); border-radius: 6px; padding: 4px 2px; text-align: center; font-size: 11px; }
  .card-detail .hours-grid .dow { font-weight: 700; color: var(--ink-faint); margin-bottom: 2px; }
  .card-detail .sources { margin-top: 6px; word-break: break-all; }
  .card-detail .sources a { display: block; font-size: 11.5px; margin-top: 2px; }
  .card-detail .conflicts { margin-top: 8px; background: var(--yellow-bg); border: 1px solid var(--yellow-bd); border-radius: 8px; padding: 6px 8px; color: var(--yellow-fg); font-size: 12px; }
  .card-detail .conflicts b { display: block; margin-bottom: 3px; }

  #map-view { position: relative; }
  #map-wrap { position: relative; border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
  #map-svg { width: 100%; height: 62vh; display: block; touch-action: manipulation; }
  #map-note { margin-top: 8px; font-size: 12px; color: var(--ink-faint); line-height: 1.6; }
  #map-legend { display: flex; flex-wrap: wrap; gap: 8px; margin: 10px 0; font-size: 12px; color: var(--ink-muted); }
  #map-legend span { display: inline-flex; align-items: center; gap: 4px; }
  #map-legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

  .map-pin { cursor: pointer; }
  .map-pin circle { stroke: var(--surface); stroke-width: 1.5; }
  .map-pin:focus-visible circle { stroke: var(--accent); stroke-width: 2.5; }

  #map-popup {
    position: absolute; left: 10px; right: 10px; bottom: 10px; background: var(--surface);
    border: 1px solid var(--border); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow);
    max-height: 55%; overflow-y: auto;
  }
  #map-popup.hidden { display: none; }
  #map-popup .close-popup { position: absolute; top: 8px; right: 8px; border: none; background: var(--surface-2); color: var(--ink-muted); width: 30px; height: 30px; border-radius: 50%; font-size: 15px; }

  #sheet-overlay {
    position: fixed; inset: 0; background: rgba(20, 17, 12, 0.4); z-index: 30;
  }
  #sheet-overlay.hidden { display: none; }
  #filter-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface);
    border-radius: 18px 18px 0 0; max-height: 84vh; overflow-y: auto; box-shadow: 0 -6px 24px rgba(0,0,0,0.25);
    padding: 14px 16px calc(16px + env(safe-area-inset-bottom));
  }
  #filter-sheet.hidden { display: none; }
  #filter-sheet .grabber { width: 40px; height: 4px; background: var(--border); border-radius: 2px; margin: 0 auto 12px; }
  #filter-sheet h2 { font-size: 16px; margin: 14px 0 8px; }
  #filter-sheet h2:first-of-type { margin-top: 0; }
  .filter-group { display: flex; flex-wrap: wrap; gap: 7px; }
  .genre-group { margin-top: 10px; }
  .genre-group:first-child { margin-top: 0; }
  .genre-group-label {
    font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: none;
    letter-spacing: 0.02em; margin-bottom: 6px;
  }
  .filter-opt .qg-count { color: var(--ink-faint); font-weight: 500; margin-left: 2px; }
  .filter-opt.checked .qg-count { color: var(--accent); }
  .filter-opt {
    min-height: 40px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-2); color: var(--ink-muted); font-size: 13.5px; font-weight: 600;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .filter-opt input { display: none; }
  .filter-opt.checked { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 2px; border-top: 1px solid var(--border); margin-top: 14px; }
  .toggle-row label { font-size: 14px; }
  .switch { position: relative; width: 46px; height: 27px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border); flex: none; }
  .switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .switch .knob { position: absolute; top: 2px; left: 2px; width: 21px; height: 21px; border-radius: 50%; background: var(--ink-faint); transition: transform 0.15s ease, background 0.15s ease; pointer-events: none; }
  .switch input:checked ~ .knob { transform: translateX(19px); background: var(--accent); }
  .sheet-actions { display: flex; gap: 10px; margin-top: 18px; }
  .sheet-actions button { flex: 1; min-height: 46px; border-radius: 11px; font-size: 14.5px; font-weight: 700; }
  .share-note { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--ink-faint); line-height: 1.6; }

  @media (min-width: 720px) {
    main { max-width: 760px; margin: 0 auto; }
    #app-header > * { max-width: 760px; margin-left: auto; margin-right: auto; }
    #filter-sheet { max-width: 760px; left: 50%; transform: translateX(-50%); border-radius: 18px 18px 0 0; }
  }
</style>

<header id="app-header">
  <div class="title-row">
    <h1>新橋エリア飲食店比較</h1>
    <span class="subtitle">新橋・西新橋・内幸町・汐留・銀座 ほか</span>
  </div>
  <div id="tabs">
    <button data-tab="list" class="active" type="button">一覧</button>
    <button data-tab="map" type="button">地図</button>
  </div>
  <div id="count-bar">
    <div><strong id="count" class="tnum">0</strong><span class="count-unit">件 該当</span></div>
    <div id="unknown-note" style="font-size:11.5px;"></div>
  </div>
  <div class="toolbar">
    <input id="search" type="search" placeholder="店名・ジャンルで検索" />
    <select id="sort-field" aria-label="並び替え項目">
      <option value="rating">評価</option>
      <option value="reviewCount">クチコミ件数</option>
      <option value="price">価格帯</option>
      <option value="openTime">日曜の営業開始時刻</option>
    </select>
    <button id="sort-dir" class="icon-btn" type="button" aria-label="並び替え方向" title="並び替え方向">↓</button>
    <button id="filter-btn" class="text-btn primary" type="button">🔍 絞り込み<span id="filter-badge" class="filter-badge hidden">0</span></button>
  </div>
  <nav id="quick-genre" aria-label="ジャンルで絞り込み"></nav>
  <div id="chips" class="chips"></div>
</header>

<main>
  <section id="list-view">
    <div id="cards"></div>
  </section>
  <section id="map-view" class="hidden">
    <div id="map-legend">
      <span><i style="background:var(--green-fg)"></i>全面禁煙</span>
      <span><i style="background:var(--yellow-fg)"></i>分煙</span>
      <span><i style="background:var(--red-fg)"></i>喫煙可</span>
      <span><i style="background:var(--gray-fg)"></i>不明</span>
      <span><i style="background:var(--purple-fg)"></i>要確認</span>
    </div>
    <div id="map-wrap">
      <svg id="map-svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid meet"></svg>
      <div id="map-popup" class="hidden"></div>
    </div>
    <p id="map-note"></p>
  </section>
</main>

<div id="sheet-overlay" class="hidden"></div>
<div id="filter-sheet" class="hidden" role="dialog" aria-label="絞り込み">
  <div class="grabber"></div>
  <h2>Google評価</h2>
  <div class="filter-group" id="f-rating"></div>
  <h2>ジャンル（大分類・中分類）</h2>
  <div id="f-genre"></div>
  <h2>エリア・最寄駅</h2>
  <div class="filter-group" id="f-area"></div>
  <h2>禁煙区分</h2>
  <div class="filter-group" id="f-smoking"></div>
  <h2>子連れ可否</h2>
  <div class="filter-group" id="f-kids"></div>
  <h2>個室</h2>
  <div class="filter-group" id="f-private"></div>
  <h2>ネット予約</h2>
  <div class="filter-group" id="f-reserve"></div>
  <div class="toggle-row">
    <label for="hide-unknown">「不明」を含む店を除外する</label>
    <span class="switch"><input id="hide-unknown" type="checkbox" /><span class="knob"></span></span>
  </div>
  <div class="sheet-actions">
    <button id="reset-filters" class="text-btn" type="button">条件をリセット</button>
    <button id="close-sheet" class="text-btn primary" type="button">閉じる（<span id="sheet-count" class="tnum">0</span>件）</button>
  </div>
  <div class="share-note">
    共有方法: 絞り込み後、各カードの「地図」リンクを開いた先のGoogleマップで「保存」→ 新規または既存のリストに追加していくと、その場所リストを他の人と共有できます（本ページから一括登録するAPIは使用していません）。<br />
    CSVエクスポート:
    <button id="csv-btn" class="text-btn" type="button" style="margin-top:6px;">絞り込み結果をCSVでダウンロード</button>

    var dir = state.sortDir === "asc" ? 1 : -1;
    list.sort(function (a, b) {
      var va = sortValue(a), vb = sortValue(b);
      var an = va === null || va === undefined, bn = vb === null || vb === undefined;
      if (an && bn) return a.name.localeCompare(b.name, "ja");
      if (an) return 1;
      if (bn) return -1;
      if (va === vb) return a.name.localeCompare(b.name, "ja");
      return va < vb ? dir : -dir;
    });
    return list;
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function telHref(phone) {
    if (!phone || isUnknown(phone)) return null;
    return "tel:" + phone.replace(/[^\d+]/g, "");
  }

  function ratingText(r) {
    var star = r.googleRating != null ? "★" + r.googleRating.toFixed(1) : "★―";
    var cnt = r.reviewCount != null ? r.reviewCount + "件" : "―件";
    return { star: star, cnt: cnt };
  }

  function cardHtml(r) {
    var rt = ratingText(r);
    var tel = telHref(r.phone);
    var expanded = state.expandedId === r.id;
    var smokeC = badgeColor("smoking", r.smokingStatus);
    var kidsC = badgeColor("kids", r.kidsFriendly);
    var sunHours = (r.hours && r.hours.sun) || "不明";

    var hoursGrid = DOW.map(function (d) {
      return '<div><div class="dow">' + DOW_LABEL[d] + '</div>' + esc((r.hours && r.hours[d]) || "不明") + "</div>";
    }).join("");

    var sourcesHtml = (r.sources || []).map(function (u) {
      return '<a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + "</a>";
    }).join("");

    var conflictsHtml = "";
    if (r.fieldConflicts && r.fieldConflicts.length) {
      conflictsHtml = '<div class="conflicts"><b>情報源により内容が食い違う項目</b>' +
        r.fieldConflicts.map(function (c) {
          return esc(c.field) + ": " + c.values.map(function (v) { return esc(v.value) + "（" + esc(v.source) + "）"; }).join(" / ");
        }).join("<br />") + "</div>";
    }

    return (
      '<div class="card" data-id="' + r.id + '">' +
        '<div class="card-top">' +
          '<div class="card-name">' + esc(r.name) + "</div>" +
          '<div class="card-rating tnum">' +
            '<span class="star">' + rt.star + "</span><br />" + rt.cnt +
          "</div>" +
        "</div>" +
        '<div class="card-meta">' + esc(r.genre) + '<span class="dot">・</span>' + esc(r.nearestStation || "不明") +
          '<span class="dot">・</span>' + esc(r.priceRangeDinner || "不明") +
        "</div>" +
        '<div class="card-hours">日: ' + esc(sunHours) + "</div>" +
        '<div class="badges">' +
          '<span class="badge badge-' + smokeC + '">' + esc(r.smokingStatus) + "</span>" +
          '<span class="badge badge-' + kidsC + '">子連れ' + esc(r.kidsFriendly) + "</span>" +
        "</div>" +
        '<div class="card-actions">' +
          (tel ? '<a href="' + tel + '">電話する</a>' : '<a aria-disabled="true">電話番号不明</a>') +
          '<a href="' + esc(r.mapsUrl) + '" target="_blank" rel="noopener">地図で見る</a>' +
          '<button type="button" class="detail-toggle" data-id="' + r.id + '">' + (expanded ? "閉じる" : "詳細") + "</button>" +
        "</div>" +
        '<div class="card-detail' + (expanded ? " open" : "") + '">' +
          '<div class="hours-grid">' + hoursGrid + "</div>" +
          "<dl>" +
            "<dt>定休日</dt><dd>" + esc(r.closedDays || "不明") + "</dd>" +
            "<dt>個室</dt><dd>" + esc(r.privateRoom || "不明") + "</dd>" +
            "<dt>ネット予約</dt><dd>" + esc(r.reservationOnline || "不明") + "</dd>" +
            "<dt>住所</dt><dd>" + esc(r.address || "不明") + "</dd>" +
            "<dt>電話番号</dt><dd>" + esc(r.phone || "不明") + "</dd>" +
          "</dl>" +
          (sourcesHtml ? '<div class="sources">情報源: ' + sourcesHtml + "</div>" : "") +
          conflictsHtml +
        "</div>" +
      "</div>"
    );
  }

  var cardsEl = document.getElementById("cards");
  var countEl = document.getElementById("count");
  var sheetCountEl = document.getElementById("sheet-count");
  var unknownNoteEl = document.getElementById("unknown-note");

  function renderList(filtered) {
    if (!filtered.length) {
      cardsEl.innerHTML = '<div class="empty-state">条件に一致する店舗がありません。絞り込み条件を見直してください。</div>';
      return;
    }
    cardsEl.innerHTML = filtered.map(cardHtml).join("");
  }

  function renderChips() {
    var chips = [];
    function addGroup(obj, prefix) {
      Object.keys(obj).forEach(function (k) {
        if (obj[k]) chips.push({ label: prefix + k, clear: function () { obj[k] = false; } });
      });
    }
    if (state.search) chips.push({ label: '検索: "' + state.search + '"', clear: function () { state.search = ""; document.getElementById("search").value = ""; } });
    if (state.minRating > 0) chips.push({ label: "★" + state.minRating.toFixed(1) + "以上", clear: function () { state.minRating = 0; } });
    addGroup(state.genres, "");
    addGroup(state.areas, "");
    addGroup(state.smoking, "禁煙:");
    addGroup(state.kids, "子連れ:");
    addGroup(state.priv, "個室:");
    addGroup(state.reserve, "予約:");
    if (state.hideUnknown) chips.push({ label: "不明を除外", clear: function () { state.hideUnknown = false; document.getElementById("hide-unknown").checked = false; } });

    var chipsEl = document.getElementById("chips");
    chipsEl.innerHTML = chips.map(function (c, i) {
      return '<span class="chip" data-i="' + i + '">' + esc(c.label) + '<button type="button" data-i="' + i + '" aria-label="解除">×</button></span>';
    }).join("");
    chipsEl.querySelectorAll("button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        chips[parseInt(btn.dataset.i, 10)].clear();
        syncFilterUI();
        rerender();
      });
    });
  }

  var quickGenreEl = document.getElementById("quick-genre");
  function renderQuickGenre() {
    var majorHtml = ['<button type="button" data-major="all" class="' + (state.activeMajor === "all" ? "active" : "") + '">すべて</button>']
      .concat(GENRE_GROUPS.map(function (g) {
        return '<button type="button" data-major="' + esc(g.name) + '" class="' + (state.activeMajor === g.name ? "active" : "") + '">' + esc(g.name) + "</button>";
      }));
    var minorGenres = state.activeMajor === "all" ? GENRES :
      (GENRE_GROUPS.filter(function (g) { return g.name === state.activeMajor; })[0] || { genres: [] }).genres;
    var minorHtml = minorGenres.map(function (g) {
      return '<button type="button" data-genre="' + esc(g) + '" class="' + (state.genres[g] ? "active" : "") + '">' +
        esc(g) + '<span class="qg-count">(' + (GENRE_COUNTS[g] || 0) + ')</span></button>';
    });
    quickGenreEl.innerHTML =
      '<div class="qg-major">' + majorHtml.join("") + "</div>" +
      '<div class="qg-minor">' + minorHtml.join("") + "</div>";

    quickGenreEl.querySelectorAll(".qg-major button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var major = btn.dataset.major;
        state.activeMajor = major;
        if (major === "all") {
          state.genres = {};
        } else {
          state.genres = {};
          GENRE_GROUPS.filter(function (g) { return g.name === major; })[0].genres.forEach(function (g) { state.genres[g] = true; });
        }
        rerender();
      });
    });
    quickGenreEl.querySelectorAll(".qg-minor button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var g = btn.dataset.genre;
        state.genres[g] = !state.genres[g];
        rerender();
      });
    });
  }

  // ---- Map (no API key: self-drawn SVG projection, no external tiles) ----
  var coordRestaurants = RESTAURANTS.filter(function (r) { return r.lat != null && r.lng != null; });
  var bounds = coordRestaurants.reduce(function (b, r) {
    b.minLat = Math.min(b.minLat, r.lat); b.maxLat = Math.max(b.maxLat, r.lat);
    b.minLng = Math.min(b.minLng, r.lng); b.maxLng = Math.max(b.maxLng, r.lng);
    return b;
  }, { minLat: 90, maxLat: -90, minLng: 180, maxLng: -180 });
  var padLat = (bounds.maxLat - bounds.minLat) * 0.12 || 0.01;
  var padLng = (bounds.maxLng - bounds.minLng) * 0.12 || 0.01;
  bounds.minLat -= padLat; bounds.maxLat += padLat;
  bounds.minLng -= padLng; bounds.maxLng += padLng;
  var avgLatRad = ((bounds.minLat + bounds.maxLat) / 2) * Math.PI / 180;
  var lngScale = Math.cos(avgLatRad);
  var VBW = 1000;
  var VBH = Math.max(400, VBW * ((bounds.maxLat - bounds.minLat) / ((bounds.maxLng - bounds.minLng) * lngScale)));
  document.getElementById("map-svg").setAttribute("viewBox", "0 0 " + VBW + " " + VBH);

  function project(lat, lng) {
    var x = ((lng - bounds.minLng) * lngScale) / ((bounds.maxLng - bounds.minLng) * lngScale) * VBW;
    var y = VBH - ((lat - bounds.minLat) / (bounds.maxLat - bounds.minLat)) * VBH;
    return { x: x, y: y };
  }

  var mapSvg = document.getElementById("map-svg");
  var mapPopup = document.getElementById("map-popup");
  var mapNote = document.getElementById("map-note");

  function popupHtml(r) {
    var rt = ratingText(r);
    var tel = telHref(r.phone);
    return (
      '<button type="button" class="close-popup" aria-label="閉じる">×</button>' +
      '<div class="card-name">' + esc(r.name) + "</div>" +
      '<div class="card-meta">' + esc(r.genre) + '<span class="dot">・</span>' + esc(r.nearestStation || "不明") + "</div>" +
      '<div class="card-rating tnum" style="text-align:left;margin-top:4px;"><span class="star">' + rt.star + "</span> " + rt.cnt + "</div>" +
      '<div class="card-hours" style="margin-top:6px;">日: ' + esc((r.hours && r.hours.sun) || "不明") + "</div>" +
      '<div class="badges"><span class="badge badge-' + badgeColor("smoking", r.smokingStatus) + '">' + esc(r.smokingStatus) + '</span>' +
      '<span class="badge badge-' + badgeColor("kids", r.kidsFriendly) + '">子連れ' + esc(r.kidsFriendly) + "</span></div>" +
      '<div class="card-actions" style="margin-top:10px;">' +
      (tel ? '<a href="' + tel + '">電話する</a>' : '<a aria-disabled="true">電話番号不明</a>') +
      '<a href="' + esc(r.mapsUrl) + '" target="_blank" rel="noopener">Googleマップで開く</a>' +
      "</div>"
    );
  }

  function renderMap(filtered) {
    var filteredIds = {};
    filtered.forEach(function (r) { filteredIds[r.id] = true; });
    var pins = coordRestaurants.filter(function (r) { return filteredIds[r.id]; });

    var svgParts = ['<rect x="0" y="0" width="' + VBW + '" height="' + VBH + '" fill="var(--surface-2)"></rect>'];
    for (var gx = 0; gx <= VBW; gx += VBW / 10) {
      svgParts.push('<line x1="' + gx + '" y1="0" x2="' + gx + '" y2="' + VBH + '" stroke="var(--border)" stroke-width="1"></line>');
    }
    for (var gy = 0; gy <= VBH; gy += VBH / 10) {
      svgParts.push('<line x1="0" y1="' + gy + '" x2="' + VBW + '" y2="' + gy + '" stroke="var(--border)" stroke-width="1"></line>');
    }
    svgParts.push('<text x="12" y="24" font-size="16" fill="var(--ink-faint)">北 ↑</text>');

    pins.forEach(function (r) {
      var p = project(r.lat, r.lng);
      var color = "var(--" + badgeColor("smoking", r.smokingStatus) + "-fg)";
      var selected = state.mapPopupId === r.id;
      svgParts.push(
        '<g class="map-pin" tabindex="0" data-id="' + r.id + '" transform="translate(' + p.x + "," + p.y + ')">' +
          '<circle r="' + (selected ? 12 : 9) + '" fill="' + color + '"></circle>' +
        "</g>"
      );
    });
    mapSvg.innerHTML = svgParts.join("");

    var hiddenCount = filtered.length - pins.length;
    mapNote.textContent = "地図はGoogle Maps JavaScript APIを使わず、緯度経度から独自実装のSVG図（簡易投影・地図タイルなし）でピンを描画しています。" +
      (hiddenCount > 0 ? "該当" + filtered.length + "件中" + hiddenCount + "件は緯度経度が不明のため地図に表示されていません（一覧タブでご確認ください）。" : "");

    if (state.mapPopupId != null && filteredIds[state.mapPopupId]) {
      var r = RESTAURANTS.filter(function (x) { return x.id === state.mapPopupId; })[0];
      mapPopup.innerHTML = popupHtml(r);
      mapPopup.classList.remove("hidden");
      mapPopup.querySelector(".close-popup").addEventListener("click", function () {
        state.mapPopupId = null; mapPopup.classList.add("hidden");
      });
    } else {
      state.mapPopupId = null;
      mapPopup.classList.add("hidden");
    }

    mapSvg.querySelectorAll(".map-pin").forEach(function (pin) {
      function open() {
        state.mapPopupId = parseInt(pin.dataset.id, 10);
        renderMap(getFiltered());
      }
      pin.addEventListener("click", open);
      pin.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
    });
  }

  // ---- Filter sheet ----
  function buildOptionGroup(containerId, options, stateObj) {
    var el = document.getElementById(containerId);
    el.innerHTML = options.map(function (o) {
      return '<label class="filter-opt"><input type="checkbox" value="' + esc(o) + '" />' + esc(o) + "</label>";
    }).join("");
    el.querySelectorAll("input").forEach(function (input) {
      input.addEventListener("change", function () {
        stateObj[input.value] = input.checked;
        input.closest(".filter-opt").classList.toggle("checked", input.checked);
        rerender();
      });
    });
  }
  function buildGenreGroupUI() {
    var el = document.getElementById("f-genre");
    el.innerHTML = GENRE_GROUPS.map(function (g) {
      var opts = g.genres.map(function (o) {
        return '<label class="filter-opt"><input type="checkbox" value="' + esc(o) + '" />' + esc(o) +
          '<span class="qg-count">(' + (GENRE_COUNTS[o] || 0) + ')</span></label>';
      }).join("");
      return '<div class="genre-group"><div class="genre-group-label">' + esc(g.name) + '</div>' +
        '<div class="filter-group">' + opts + "</div></div>";
    }).join("");
    el.querySelectorAll("input").forEach(function (input) {
      input.addEventListener("change", function () {
        state.genres[input.value] = input.checked;
        input.closest(".filter-opt").classList.toggle("checked", input.checked);
        rerender();
      });
    });
  }
  buildGenreGroupUI();
  buildOptionGroup("f-area", AREAS, state.areas);
  buildOptionGroup("f-smoking", SMOKING_OPTS, state.smoking);
  buildOptionGroup("f-kids", KIDS_OPTS, state.kids);
  buildOptionGroup("f-private", PRIVATE_OPTS, state.priv);
  buildOptionGroup("f-reserve", RESERVE_OPTS, state.reserve);

  var RATING_OPTS = [
    { label: "指定なし", value: 0 },
    { label: "★3.0以上", value: 3.0 },
    { label: "★3.5以上", value: 3.5 },
    { label: "★4.0以上", value: 4.0 },
    { label: "★4.5以上", value: 4.5 },
  ];
  function buildRatingGroup() {
    var el = document.getElementById("f-rating");
    el.innerHTML = RATING_OPTS.map(function (o) {
      return '<label class="filter-opt"><input type="radio" name="rating" value="' + o.value + '" />' + esc(o.label) + "</label>";
    }).join("");
    el.querySelectorAll("input").forEach(function (input) {
      input.addEventListener("change", function () {
        state.minRating = parseFloat(input.value);
        el.querySelectorAll(".filter-opt").forEach(function (opt) { opt.classList.remove("checked"); });
        input.closest(".filter-opt").classList.add("checked");
        rerender();
      });
    });
    var zero = el.querySelector('input[value="0"]');
    zero.checked = true;
    zero.closest(".filter-opt").classList.add("checked");
  }
  buildRatingGroup();

  function syncFilterUI() {
    document.querySelectorAll("#filter-sheet input[type=checkbox]").forEach(function (input) {
      if (input.id === "hide-unknown") return;
      var group = input.closest('[id^="f-"]');
      if (!group) return;
      var stateObj = { "f-genre": state.genres, "f-area": state.areas, "f-smoking": state.smoking, "f-kids": state.kids, "f-private": state.priv, "f-reserve": state.reserve }[group.id];
      if (!stateObj) return;
      input.checked = !!stateObj[input.value];
      input.closest(".filter-opt").classList.toggle("checked", input.checked);
    });
    document.getElementById("hide-unknown").checked = state.hideUnknown;
    document.querySelectorAll("#f-rating input").forEach(function (input) {
      var checked = parseFloat(input.value) === state.minRating;
      input.checked = checked;
      input.closest(".filter-opt").classList.toggle("checked", checked);
    });
  }

  document.getElementById("hide-unknown").addEventListener("change", function (e) {
    state.hideUnknown = e.target.checked;
    rerender();
  });

  document.getElementById("reset-filters").addEventListener("click", function () {
    state.genres = {}; state.areas = {}; state.smoking = {}; state.kids = {}; state.priv = {}; state.reserve = {};
    state.hideUnknown = false; state.search = ""; state.minRating = 0; state.activeMajor = "all";
    document.getElementById("search").value = "";
    syncFilterUI();
    rerender();
  });

  var overlay = document.getElementById("sheet-overlay");
  var sheet = document.getElementById("filter-sheet");
  function openSheet() { syncFilterUI(); overlay.classList.remove("hidden"); sheet.classList.remove("hidden"); }
  function closeSheet() { overlay.classList.add("hidden"); sheet.classList.add("hidden"); }
  document.getElementById("filter-btn").addEventListener("click", openSheet);
  document.getElementById("close-sheet").addEventListener("click", closeSheet);
  overlay.addEventListener("click", closeSheet);

  // ---- Tabs ----
  document.querySelectorAll("#tabs button").forEach(function (btn) {
    btn.addEventListener("click", function () {
      state.tab = btn.dataset.tab;
      document.querySelectorAll("#tabs button").forEach(function (b) { b.classList.toggle("active", b === btn); });
      document.getElementById("list-view").classList.toggle("hidden", state.tab !== "list");
      document.getElementById("map-view").classList.toggle("hidden", state.tab !== "map");
      rerender();
    });
  });

  // ---- Search / sort ----
  var searchTimer = null;
  document.getElementById("search").addEventListener("input", function (e) {
    clearTimeout(searchTimer);
    var v = e.target.value;
    searchTimer = setTimeout(function () { state.search = v; rerender(); }, 120);
  });
  document.getElementById("sort-field").addEventListener("change", function (e) {
    state.sortField = e.target.value; rerender();
  });
  document.getElementById("sort-dir").addEventListener("click", function () {
    state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    document.getElementById("sort-dir").textContent = state.sortDir === "asc" ? "↑" : "↓";
    rerender();
  });

  // ---- Card expand ----
  cardsEl.addEventListener("click", function (e) {
    var btn = e.target.closest(".detail-toggle");
    if (!btn) return;
    var id = parseInt(btn.dataset.id, 10);
    state.expandedId = state.expandedId === id ? null : id;
    rerender();
  });

  // ---- CSV export ----
  function csvEscape(v) {
    var s = v == null ? "" : String(v);
    if (/[",\n]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
    return s;
  }
  document.getElementById("csv-btn").addEventListener("click", function () {
    var rows = getFiltered();
    var header = ["店名", "エリア・最寄駅", "ジャンル", "Google評価", "クチコミ件数", "価格帯(夜)",
      "月", "火", "水", "木", "金", "土", "日", "定休日", "禁煙区分", "子連れ可否", "個室", "ネット予約",
      "電話番号", "住所", "緯度", "経度", "GoogleマップURL", "情報源URL"];
    var lines = [header.map(csvEscape).join(",")];
    rows.forEach(function (r) {
      var line = [
        r.name, r.nearestStation, r.genre, r.googleRating, r.reviewCount, r.priceRangeDinner,
        r.hours && r.hours.mon, r.hours && r.hours.tue, r.hours && r.hours.wed, r.hours && r.hours.thu,
        r.hours && r.hours.fri, r.hours && r.hours.sat, r.hours && r.hours.sun,
        r.closedDays, r.smokingStatus, r.kidsFriendly, r.privateRoom, r.reservationOnline,
        r.phone, r.address, r.lat, r.lng, r.mapsUrl, (r.sources || []).join(" | "),
      ].map(csvEscape).join(",");
      lines.push(line);
    });
    var blob = new Blob(["﻿" + lines.join("\r\n")], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = "shinbashi-restaurants.csv";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  function activeFilterCount() {
    function n(obj) { return Object.keys(obj).filter(function (k) { return obj[k]; }).length; }
    return n(state.genres) + n(state.areas) + n(state.smoking) + n(state.kids) + n(state.priv) + n(state.reserve) +
      (state.minRating > 0 ? 1 : 0) + (state.hideUnknown ? 1 : 0);
  }

  var filterBadgeEl = document.getElementById("filter-badge");
  function rerender() {
    var filtered = getFiltered();
    countEl.textContent = filtered.length;
    sheetCountEl.textContent = filtered.length;
    var unknownCount = filtered.filter(hasUnknownFields).length;
    unknownNoteEl.textContent = unknownCount > 0 ? "うち不明を含む: " + unknownCount + "件" : "";
    renderQuickGenre();
    renderChips();
    var fc = activeFilterCount();
    filterBadgeEl.textContent = fc;
    filterBadgeEl.classList.toggle("hidden", fc === 0);
    if (state.tab === "list") renderList(filtered);
    else renderMap(filtered);
  }

  rerender();
})();
</script>
